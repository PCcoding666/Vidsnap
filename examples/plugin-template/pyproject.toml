[project]
name = "video-metadata"
version = "0.1.0"
description = "Deterministic local video metadata tool plugin for VidSnap."
requires-python = ">=3.10"
dependencies = ["vidsnap-harness>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_metadata"]

[project.entry-points."vidsnap.plugins"]
video-metadata = "video_metadata.plugin:TOOL"
