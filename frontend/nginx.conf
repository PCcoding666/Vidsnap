# VidSnap 前端 nginx：托管 SPA + 反代 /api 到 backend 容器
# location 用最长前缀匹配，更具体的 jobs/ws 规则会优先于通用 /api/
server {
    listen 80;
    server_name _;

    # 覆盖目标视频体积（见 docs/deployment.md）
    client_max_body_size 1G;

    root /usr/share/nginx/html;
    index index.html;

    # workspace job SSE：仅对 /events 禁用缓冲（正则优先匹配）。
    # 不能用 `location /api/v1/workspace/jobs/`（带尾斜杠 + proxy_pass 带 URI）——
    # 那会让无尾斜杠的 POST /jobs 被 nginx 301 补斜杠，浏览器把 POST 降级成 GET、丢掉上传 body。
    location ~ ^/api/v1/workspace/jobs/[^/]+/events$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # WebSocket（/api/v1/ws/...）
    location /api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # 其余 API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # 健康检查直通
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # 静态资源缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
