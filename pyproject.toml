"src/vidsnap/demo/fixtures/provenance.json" = "src/vidsnap/demo/fixtures/provenance.json"
"src/vidsnap/demo/fixtures/run/manifest.json" = "src/vidsnap/demo/fixtures/run/manifest.json"
