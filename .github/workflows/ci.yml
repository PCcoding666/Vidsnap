name: Harness CI

on:
  push:
    branches: [vidsnap_slim, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install harness and offline tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server,dev]'

      - name: Lint and type check
        run: |
          ruff format --check src tests scripts
          ruff check .
          mypy src

      - name: Offline tests and package build
        run: |
          python -m pytest -q
          python -m build

      - name: Wheel smoke test
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/vidsnap --help
          .wheel-smoke/bin/vidsnap conformance

      - name: Harness release gates
        run: |
          vidsnap --help
          vidsnap conformance
          python scripts/secret_scan.py
          git diff --check
