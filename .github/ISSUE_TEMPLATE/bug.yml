name: Bug
description: Report a reproducible defect in the offline harness.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. VidSnap Harness runs locally and offline; please keep your report self-contained with no network access, model calls, or credentials.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the harness does the defect affect?
      options:
        - CLI
        - Core runtime
        - Contracts
        - Tools or plugins
        - Local video or subtitle ingestion
        - Providers
        - Recipes
        - RunBundle or trace/replay
        - API adapter
        - Documentation or benchmarks
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment and version
      description: Operating system, Python version, and the vidsnap package version or commit you ran.
      placeholder: e.g. Ubuntu 24.04, Python 3.12.3, vidsnap 0.1.0 (commit 031d8da6)
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed behavior
      description: What actually happened? Include the exact command output, error message, or log excerpt.
      placeholder: Paste the exact output here.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead, given the documented behavior?
    validations:
      required: true

  - type: textarea
    id: offline-reproduction
    attributes:
      label: Minimal offline reproduction
      description: The smallest sequence of steps that reproduces the defect offline, using recorded fixtures or your own local media (not attached). No network, no model calls, no credentials.
      placeholder: |
        # commands run and their output
        vidsnap demo
        vidsnap conformance
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: Submission checklist
      description: Confirm that nothing sensitive or unshareable is attached to this report.
      options:
        - label: No credentials, API keys, tokens, or environment-variable values are included.
          required: true
        - label: No media files, datasets, or links to personal media are included.
          required: true
        - label: No RunBundles or other run artifacts are included.
          required: true
        - label: No raw provider requests, responses, or model traces are included.
          required: true
