name: Task Contract
description: Propose a task card with the six VidSnap Task Contract fields.
title: "[Task]: "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: The single outcome this task card must reach and how it advances the current main objective in PROJECT_STATE.md.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What this task explicitly must not do, including out-of-scope changes and forbidden artifacts.
    validations:
      required: true
  - type: textarea
    id: acceptance_evidence
    attributes:
      label: Acceptance Evidence
      description: The observable artifacts, commands, and gate results that prove completion, with known limitations recorded rather than hidden.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Authority / Data / Secret Boundaries
      description: Who authorizes what, and which data, secrets, or artifacts (credentials, media, datasets, RunBundles, benchmark results, cookies, .env files, raw provider requests/responses) may never be committed.
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: Owner / Executor / Reviewer
      description: The human owner and final merge authority, the executor, the reviewer, and the independent verifier for this task.
    validations:
      required: true
  - type: textarea
    id: next_human_gate
    attributes:
      label: Next Human Gate
      description: The next human decision required before this task can advance to its following state.
    validations:
      required: true
