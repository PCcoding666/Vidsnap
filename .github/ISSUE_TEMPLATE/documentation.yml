name: Documentation
description: Report a documentation problem or propose an improvement.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the VidSnap Harness documentation. Please point to the exact location of the problem and describe it so it can be verified against the current source.
  - type: input
    id: page-path
    attributes:
      label: Page or path
      description: Repository file path, URL, or section heading where the problem appears.
      placeholder: e.g. docs/README.md, "Architecture" section in README.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, outdated, missing, or unclear? Quote the relevant text where possible.
    validations:
      required: true
  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed improvement
      description: What should the documentation say or include instead?
    validations:
      required: true
  - type: dropdown
    id: intended-reader
    attributes:
      label: Intended reader
      description: Who is this documentation primarily for?
      options:
        - New contributor getting started
        - Plugin or tool developer
        - Python API / embedding user
        - Operator running analyses locally
        - Other
    validations:
      required: true
  - type: checkboxes
    id: factual-verification
    attributes:
      label: Factual verification
      description: Confirm the report reflects the current state of the repository.
      options:
        - label: I checked the page against the current code and configuration on the latest default branch, and the problem exists there.
          required: true
        - label: This report is about documentation content, not a question about code behavior I have not tested myself.
          required: true
  - type: checkboxes
    id: sensitive-data-check
    attributes:
      label: Sensitive and live-run data checklist
      description: Confirm nothing sensitive or produced by a live run is attached to this issue.
      options:
        - label: I confirm no credentials, API keys, cookies, or .env file contents are included or attached.
          required: true
        - label: I confirm no personal media, datasets, RunBundles, or benchmark results are included or attached.
          required: true
        - label: I confirm no raw provider requests/responses, logs, or traces generated by a live run are included or attached.
          required: true